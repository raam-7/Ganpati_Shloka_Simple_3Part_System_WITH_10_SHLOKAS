<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ganpati Shloka</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: radial-gradient(circle at 50% 0%, #7b2918 0%, #35120d 42%, #170907 100%); }
    .page-shell { max-width: 900px; margin: 0 auto; }
    .shloka-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(242,196,92,.28);
      border-radius: 30px;
      padding: 30px 22px;
      box-shadow: 0 25px 80px rgba(0,0,0,.25);
      margin-top: 14px;
    }
    .ref { font-size: 1.05rem; color: #d9bd90; font-weight: 800; margin: 8px 0 16px; }
    .sanskrit { font-size: clamp(1.7rem, 4vw, 2.4rem); line-height: 1.7; color: #ffe7ad; font-family: Georgia, serif; margin: 20px 0; }
    .tabs { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 20px; }
    .tab { background: rgba(255,255,255,.04); border: 1px solid rgba(242,196,92,.3); color: #f7e3b1; border-radius: 999px; padding: 9px 14px; font-weight: 800; cursor: pointer; }
    .tab.active { background: linear-gradient(135deg, #c38b26, #f5d789); color: #310f0b; border-color: transparent; }
    .translation { font-size: 1.1rem; line-height: 1.8; color: #f5e2bd; margin: 18px 0; }
    .info-box { background: rgba(255,255,255,.04); border: 1px solid rgba(242,196,92,.2); border-radius: 18px; padding: 16px 18px; margin-top: 18px; }
    .voice-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 20px; }
    .voice-row .btn { min-width: 190px; }
    .muted-note { font-size: .83rem; color: #dfc694; }
    @media (max-width: 620px) { .voice-row .btn { width: 100%; } }
  </style>
</head>
<body>
  <div class="wrap page-shell">
    <div class="top">
      <div class="brand">🪔 GANPATI HOUSE</div>
      <div class="nav">
        <a href="index.html" class="alt">Home</a>
        <a href="shlokas.html" class="alt">Explore Shlokas</a>
      </div>
    </div>

    <section class="hero" style="padding:45px 0 20px;">
      <div class="om">ॐ</div>
      <div class="eyebrow">॥ श्री गणेशाय नमः ॥</div>
      <h1 style="font-size:clamp(2.1rem,6vw,4rem);">Welcome to Our Ganpati House</h1>
      <p>Pause. Read. Reflect. Listen.</p>
    </section>

    <main class="shloka-card" id="app"><div class="muted">Loading your shloka…</div></main>

    <footer>🐘 गणपती बाप्पा मोरया!<br><small>May wisdom, peace and happiness guide your day.</small></footer>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const id = Number(params.get('id'));
    let current = null;

    function esc(value) {
      return String(value || '').replace(/[&<>"']/g, (m) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[m]));
    }

    function findById(items, targetId) {
      return (items || []).find((item) => Number(item.id) === Number(targetId));
    }

    async function loadShloka() {
      const app = document.getElementById('app');
      if (!id && id !== 0) {
        app.innerHTML = '<h2>Shloka not found</h2><p class="muted">No shloka ID was provided.</p>';
        return;
      }

      let item = null;
      if (window.isSupabaseConfigured && window.isSupabaseConfigured()) {
        try {
          const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
          const { data, error } = await sb.from('shlokas').select('*').eq('id', id).single();
          if (!error && data) item = data;
        } catch (error) {
          console.warn('Supabase lookup failed, using fallback.', error);
        }
      }

      if (!item) {
        item = findById(window.getFallbackShlokas ? window.getFallbackShlokas() : [], id);
      }

      if (!item) {
        app.innerHTML = '<h2>Shloka not found</h2><p class="muted">The selected shloka could not be loaded.</p>';
        return;
      }

      current = item;
      renderTranslation('english');
    }

    function renderTranslation(lang) {
      const app = document.getElementById('app');
      const labels = { english: 'English', marathi: 'मराठी', hindi: 'हिन्दी' };
      const translation = { english: current.english, marathi: current.marathi, hindi: current.hindi }[lang] || current.english;

      app.innerHTML = `
        <div class="eyebrow">${esc(current.problem || 'Life Situation')} → ${esc(current.solution || 'Wisdom')}</div>
        <h2>${esc(current.title || current.problem)}</h2>
        <div class="ref">Bhagavad Gita • Chapter ${esc(current.chapter || '')} • Verse ${esc(current.verse || '')}</div>
        <div class="sanskrit">${esc(current.sanskrit)}</div>
        <p class="muted">${esc(current.transliteration || '')}</p>

        <div class="tabs">
          ${Object.entries(labels).map(([key, label]) => `
            <button class="tab ${key === lang ? 'active' : ''}" type="button" onclick="renderTranslation('${key}')">${label}</button>
          `).join('')}
        </div>

        <div class="translation">${esc(translation)}</div>

        <div class="info-box">
          <strong>📖 Simple Meaning</strong>
          <p class="muted">${esc(current.meaning || 'This teaching helps guide daily living with balance and wisdom.')}</p>
        </div>

        <div class="info-box">
          <strong>🌱 For Your Life</strong>
          <p class="muted">${esc(current.message || 'Carry this lesson with humility and let it guide your response in daily life.')}</p>
        </div>

        <div class="voice-row">
          <button class="btn" type="button" onclick="speakInLanguage('english')">🔊 English</button>
          <button class="btn alt" type="button" onclick="speakInLanguage('marathi')">🔊 मराठी</button>
          <button class="btn alt" type="button" onclick="speakInLanguage('hindi')">🔊 हिन्दी</button>
          <button class="btn alt" type="button" onclick="stopVoice()">⏹ Stop</button>
        </div>
        <p class="muted-note" style="margin-top:16px; text-align:center;">Voice uses the browser’s built-in speech engine.</p>
      `;
    }

    function speakInLanguage(lang) {
      if (!('speechSynthesis' in window)) {
        alert('Speech synthesis is not supported in this browser.');
        return;
      }
      const text = { english: current.english, marathi: current.marathi, hindi: current.hindi }[lang] || current.english;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang === 'english' ? 'en-IN' : lang === 'marathi' ? 'mr-IN' : 'hi-IN';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    function stopVoice() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    window.renderTranslation = renderTranslation;
    window.speakInLanguage = speakInLanguage;
    window.stopVoice = stopVoice;
    loadShloka();
  </script>
</body>
</html>
