<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login — Ganpati Shloka</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { min-height: 100vh; display: grid; place-items: center; }
    .auth-box {
      width: min(500px, 92vw);
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(242,196,92,.28);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 24px 70px rgba(0,0,0,.25);
    }
    .auth-box h1 { margin: 12px 0 6px; font-size: clamp(2rem, 4vw, 2.8rem); }
    .auth-form { display: grid; gap: 16px; margin-top: 18px; }
    .auth-form label { display: grid; gap: 8px; color: #f3d799; font-weight: 700; }
    .auth-form input {
      width: 100%;
      background: rgba(18,7,6,.75);
      border: 1px solid rgba(242,196,92,.35);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff3d6;
    }
    .auth-status { min-height: 24px; color: #ffd2d2; font-weight: 700; }
  </style>
</head>
<body>
  <div class="auth-box">
    <div class="eyebrow">॥ श्री गणेशाय नमः ॥</div>
    <h1>Admin Station</h1>
    <form class="auth-form" id="loginForm">
      <label>
        Email
        <input type="email" id="email" placeholder="admin@example.com" required>
      </label>
      <label>
        Password
        <input type="password" id="password" placeholder="Enter your password" required>
      </label>
      <button class="btn" type="submit">Login</button>
      <div id="status" class="auth-status"></div>
    </form>
  </div>

  <script>
    const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    async function checkSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        window.location.href = 'admin.html';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const status = document.getElementById('status');

      if (!email || !password) {
        status.textContent = 'Please enter your email and password.';
        return;
      }

      status.textContent = 'Signing in...';

      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        status.textContent = 'Invalid email or password. Please try again.';
        return;
      }

      if (data && data.session) {
        window.location.href = 'admin.html';
      }
    });

    checkSession();
  </script>
</body>
</html>
